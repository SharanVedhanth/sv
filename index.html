<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Us ❤️</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia, "Times New Roman", serif;
}


/* =========================
   PAGE SYSTEM
========================= */

.page{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

.page.active{
    display:block;
}


/* =========================
   HOME
========================= */

.home-background{
    position:absolute;
    inset:0;

    background-image:url("background/homeBG.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:0;
}

.home-overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.18);

    z-index:1;
}

.home-content{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:35px;

    padding:30px;
}

.home-card{
    width:190px;
    height:190px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:25px;
    letter-spacing:1px;

    cursor:pointer;

    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.35);

    backdrop-filter:blur(7px);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.22);

    transition:
        transform 0.45s ease,
        box-shadow 0.45s ease,
        background 0.45s ease;
}

.home-card:hover{
    transform:
        translateY(-10px)
        scale(1.04);

    background:rgba(255,255,255,0.22);

    box-shadow:
        0 22px 55px rgba(0,0,0,0.3);
}


/* =========================
   GALLERY BACKGROUND
========================= */

.gallery-background{
    position:absolute;
    inset:0;

    background-image:url("background/gallery-bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    z-index:0;
}

.gallery-overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.08);

    z-index:1;
}


/* =========================
   GALLERY TITLE
========================= */

.gallery-title{
    position:absolute;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:white;

    font-size:32px;
    font-weight:bold;

    text-shadow:
        0 3px 10px rgba(0,0,0,0.45);

    animation:titleAppear 0.8s ease both;
}

@keyframes titleAppear{

    from{
        opacity:0;
        transform:translateX(-50%) translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }

}


/* =========================
   BACK BUTTON
========================= */

.back-button{
    position:absolute;

    top:17px;
    left:18px;

    z-index:30;

    padding:9px 16px;

    border:none;
    border-radius:20px;

    color:white;
    background:rgba(0,0,0,0.35);

    cursor:pointer;

    backdrop-filter:blur(5px);

    transition:
        transform 0.3s ease,
        background 0.3s ease;
}

.back-button:hover{
    transform:translateX(-3px);
    background:rgba(0,0,0,0.55);
}


/* =========================
   HANGING WIRES
========================= */

.gallery-wire{
    position:absolute;

    top:65px;

    height:2px;

    background:rgba(35,35,35,0.7);

    transform-origin:left center;

    z-index:3;
}

.wire-1{
    left:-5%;
    width:38%;

    transform:rotate(5deg);
}

.wire-2{
    left:26%;
    width:34%;

    transform:rotate(-4deg);
}

.wire-3{
    left:55%;
    width:30%;

    transform:rotate(6deg);
}

.wire-4{
    left:80%;
    width:27%;

    transform:rotate(-5deg);
}


/* =========================
   LIGHT BULBS
========================= */

.bulb{
    position:absolute;

    width:13px;
    height:18px;

    border-radius:50%;

    background:#fff6c7;

    box-shadow:
        0 0 10px rgba(255,240,150,0.9),
        0 0 25px rgba(255,230,120,0.7);

    z-index:4;

    animation:
        bulbSwing 4s ease-in-out infinite;
}

.bulb::before{
    content:"";

    position:absolute;

    width:2px;
    height:18px;

    background:#222;

    left:50%;
    bottom:100%;

    transform:translateX(-50%);
}

.bulb-1{
    left:11%;
    top:59px;

    animation-delay:0s;
}

.bulb-2{
    left:38%;
    top:65px;

    animation-delay:0.8s;
}

.bulb-3{
    left:68%;
    top:62px;

    animation-delay:1.5s;
}

.bulb-4{
    left:88%;
    top:67px;

    animation-delay:2.2s;
}

@keyframes bulbSwing{

    0%,
    100%{
        transform:rotate(-2deg);
    }

    50%{
        transform:rotate(2deg);
    }

}


/* =========================
   PHOTO AREA
========================= */

.gallery-photo-area{
    position:absolute;

    left:0;
    right:0;

    top:72px;
    bottom:12px;

    z-index:5;
}


/* =========================
   POLAROID
========================= */

.photo-hanger{
    position:absolute;

    width:112px;

    padding:8px 8px 24px 8px;

    background:#fffdf7;

    border-radius:2px;

    box-shadow:
        0 9px 18px rgba(0,0,0,0.28),
        0 2px 4px rgba(0,0,0,0.12);

    cursor:pointer;

    transform-origin:center top;

    transition:
        transform 0.4s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.4s ease;

    opacity:0;

    animation:
        polaroidAppear 0.8s cubic-bezier(.2,.8,.2,1) forwards;
}

.photo-hanger img{
    display:block;

    width:100%;
    height:100px;

    object-fit:cover;

    user-select:none;

    pointer-events:none;
}


/* =========================
   POLAROID HOVER
========================= */

.photo-hanger:hover{
    z-index:50;

    transform:
        rotate(0deg)
        translateY(-10px)
        scale(1.09);

    box-shadow:
        0 20px 35px rgba(0,0,0,0.35);
}


/* =========================
   POLAROID APPEAR ANIMATION
========================= */

@keyframes polaroidAppear{

    0%{
        opacity:0;

        transform:
            translateY(-35px)
            rotate(0deg)
            scale(0.85);
    }

    70%{
        opacity:1;

        transform:
            translateY(5px)
            rotate(var(--rotation))
            scale(1.02);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            rotate(var(--rotation))
            scale(1);
    }

}


/* =========================
   INDIVIDUAL POLAROIDS
========================= */

.photo-1{
    left:4%;
    top:4%;

    --rotation:-7deg;
    transform:rotate(-7deg);

    animation-delay:0.05s;
}

.photo-2{

}

.photo-3{

}

.photo-4{

    animation-delay:0.35s;
}

.photo-5{

    transform:rotate(4deg);

    animation-delay:0.45s;
}

.photo-6{

    top:37%;

    --rotation:-6deg;

    animation-delay:0.55s;
}

.photo-7{
    right:28%;
    top:46%;

    --rotation:5deg;
    transform:rotate(5deg);

    animation-delay:0.65s;
}

.photo-8{

    top:40%;

    --rotation:-5deg;
    transform:rotate(-5deg);

    animation-delay:0.75s;
}

.photo-9{
    left:2%;
    top:72%;

    --rotation:6deg;
    transform:rotate(6deg);

    animation-delay:0.85s;
}

.photo-10{
    left:24%;
    top:67%;

    --rotation:-5deg;
    transform:rotate(-5deg);

    animation-delay:0.95s;
}

.photo-11{
    left:48%;
    top:69%;

    --rotation:3deg;
    transform:rotate(3deg);

    animation-delay:1.05s;
}

.photo-12{
    right:7%;
    top:73%;

    --rotation:-6deg;
    transform:rotate(-6deg);

    animation-delay:1.15s;
}

.photo-13{
    left:15%;
    top:28%;

    --rotation:-4deg;
    transform:rotate(-4deg);

    animation-delay:1.25s;
}

.photo-14{
    left:57%;
    top:22%;

    --rotation:6deg;
    transform:rotate(6deg);

    animation-delay:1.35s;
}

.photo-15{
    right:15%;
    top:30%;

    --rotation:-4deg;
    transform:rotate(-4deg);

    animation-delay:1.45s;
}

.photo-16{
    left:39%;
    top:55%;

    --rotation:7deg;
    transform:rotate(7deg);

    animation-delay:1.55s;
}

.photo-17{
    right:14%;
    top:2%;

    --rotation:-6deg;
    transform:rotate(-6deg);

    animation-delay:1.65s;
}

.photo-18{
    right:30%;
    top:1%;

    --rotation:5deg;
    transform:rotate(5deg);

    animation-delay:1.75s;
}

/* =========================
   FAVORITE / BIG POLAROIDS
========================= */

.photo-big-1{
    width:145px;
}

.photo-big-1 img{

}

.photo-big-2{

}

.photo-big-2 img{

.photo-big-3{

.photo-big-3 img{

}


/* Bigger photo positions */

}

.photo-7.photo-big-2{
    right:24%;
    top:41%;
}

.photo-11.photo-big-3{
    left:47%;
    top:66%;
}


/* =========================
   PHOTO VIEWER
========================= */

.photo-viewer{
    position:fixed;

    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,0.86);

    z-index:100;
}

.photo-viewer.active{
    display:flex;

    animation:viewerFade 0.3s ease;
}

@keyframes viewerFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

.viewer-image{
    max-width:88vw;
    max-height:88vh;

    object-fit:contain;

    background:white;

    padding:10px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.6);

    animation:viewerImageIn 0.4s cubic-bezier(.2,.8,.2,1);
}

@keyframes viewerImageIn{

    from{
        transform:scale(0.8) rotate(-3deg);
    }

    to{
        transform:scale(1) rotate(0);
    }

}

.viewer-close{
    position:absolute;

    top:20px;
    right:25px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    color:white;
    background:rgba(255,255,255,0.15);

    font-size:24px;

    cursor:pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

.viewer-close:hover{
    background:rgba(255,255,255,0.3);
    transform:rotate(90deg);
}


/* =========================
   WORDS / US PLACEHOLDERS
========================= */

.placeholder-page{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:35px;

    background:#222;
}


/* =========================

========================= */

    }

    }

    }

}

</style>
</head>


<body>

    class="photo-viewer"
    onclick="closePhoto()"
>

        class="viewer-close"
        onclick="event.stopPropagation(); closePhoto()"
    >
        ×
    </button>

    <img
        id="viewerImage"
        class="viewer-image"
        onclick="event.stopPropagation()"
    >

</div>



<script>

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page){

    document
        .querySelectorAll('.page')
        .forEach(function(p){

            p.classList.remove('active');

        });

    const selected =
        document.getElementById(page);

    if(selected){

        selected.classList.add('active');

    }

}


/* =========================
   PHOTO VIEWER
========================= */

function openPhoto(src){

    const viewer =
        document.getElementById('photoViewer');

    const image =
        document.getElementById('viewerImage');

    image.src = src;

    viewer.classList.add('active');

}


function closePhoto(){

    document
        .getElementById('photoViewer')
        .classList.remove('active');

}


/* =========================
   ESCAPE TO CLOSE PHOTO
========================= */

document.addEventListener(
    'keydown',
    function(event){

        if(event.key === 'Escape'){

            closePhoto();

        }

    }
);

</script>
